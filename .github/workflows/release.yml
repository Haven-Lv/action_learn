# 打 tag 时构建 APK 并发布到 GitHub Release（永久可下载）
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # 创建 Release 需要写权限

jobs:
  release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: 构建 debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: 重命名并整理产物
        run: |
          mkdir -p release-out
          cp android-app/app/build/outputs/apk/debug/app-debug.apk \
             "release-out/HelloAPK-${GITHUB_REF_NAME}-debug.apk"
          ls -lh release-out/

      - name: 发布 Release 并挂上 APK
        uses: softprops/action-gh-release@v3
        with:
          files: release-out/*.apk
          generate_release_notes: true
